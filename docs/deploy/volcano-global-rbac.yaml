apiVersion: v1
kind: ServiceAccount
metadata:
  name: volcano-global-controller-manager
  namespace: volcano-global
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: volcano-global-controller-manager-role
rules:
  - apiGroups: ["batch.volcano.sh"]
    resources: ["hyperjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch.volcano.sh"]
    resources: ["hyperjobs/status"]
    verbs: ["get", "update"]
  - apiGroups: ["batch.volcano.sh"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update"]
  - apiGroups: ["policy.karmada.io"]
    resources: ["propagationpolicies"]
    verbs: ["get", "list", "watch", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: volcano-global-controller-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: volcano-global-controller-manager-role
subjects:
- kind: ServiceAccount
  name: volcano-global-controller-manager
  namespace: volcano-global